<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fratch TV</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>"
    />
    <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      /* Wrapper a schermo intero (è lui che va in fullscreen) */
      #tvRoot {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
      }

      /* Lo stage: proporzione fissa, sempre interamente visibile */
      #tvStage {
        --ratio: 1.7778;
        position: relative;
        aspect-ratio: var(--ratio);
        width: min(100vw, calc(100vh * var(--ratio)));
        background: #000;
        overflow: hidden;
        container-type: size; /* abilita le unità cqw per logo e OSD */
      }

      #videoPlayer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #videoPlayer .vjs-tech {
        object-fit: contain;
      }
      .vjs-big-play-button {
        display: none !important;
      }

      /* Logo */
      #tvLogo {
        position: absolute;
        z-index: 5;
        width: calc(var(--logo-size, 12) * 1cqw);
        pointer-events: none;
        user-select: none;
      }
      #tvLogo[hidden] {
        display: none;
      }
      #tvLogo[data-pos="top-right"] {
        top: calc(var(--logo-margin, 2) * 1cqw);
        right: calc(var(--logo-margin, 2) * 1cqw);
      }
      #tvLogo[data-pos="top-left"] {
        top: calc(var(--logo-margin, 2) * 1cqw);
        left: calc(var(--logo-margin, 2) * 1cqw);
      }
      #tvLogo[data-pos="bottom-right"] {
        bottom: calc(var(--logo-margin, 2) * 1cqw);
        right: calc(var(--logo-margin, 2) * 1cqw);
      }
      #tvLogo[data-pos="bottom-left"] {
        bottom: calc(var(--logo-margin, 2) * 1cqw);
        left: calc(var(--logo-margin, 2) * 1cqw);
      }

      /* Messaggio temporaneo (cambio formato ecc.) */
      #osd {
        position: absolute;
        z-index: 6;
        top: 2cqw;
        left: 2cqw;
        padding: 0.6cqw 1.4cqw;
        font:
          600 2cqw/1.2 system-ui,
          sans-serif;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 0.6cqw;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      #osd.visible {
        opacity: 1;
      }

      #playButton {
        position: fixed;
        z-index: 10;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background-color: #007bff;
        color: #fff;
        font-size: 25px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        border: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="tvRoot">
      <div id="tvStage" data-aspect="16:9">
        <video id="videoPlayer" class="video-js" controls>
          Your browser does not support the video tag.
        </video>
        <img id="tvLogo" alt="" hidden />
        <div id="osd"></div>
      </div>
    </div>

    <button id="playButton" aria-label="Play"><span>&#9654;</span></button>

    <noscript
      ><p>
        This page requires JavaScript. Please enable it in your browser.
      </p></noscript
    >

    <script src="https://vjs.zencdn.net/8.6.1/video.js"></script>
    <script src="/scripts/stage.js"></script>
    <script src="/scripts/playVideos.js"></script>
  </body>
</html>
