<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fratch TV</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>"
    />
    <link rel="stylesheet" href="/vendor/videojs/video-js.min.css" />
    <link rel="stylesheet" href="/styles/tv.css" />
  </head>
  <body>
    <div id="tvRoot">
      <div id="tvStage" data-aspect="16:9">
        <video id="videoPlayer" class="video-js" controls playsinline>

    <button id="playButton" aria-label="Play"><span>&#9654;</span></button>

      ><p>

      </p></noscript
    >

    <script src="/vendor/videojs/video.min.js"></script>

  </body>
</html>
